<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Personality Builder Replica</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <div class="titlebar">
      Personality Builder Replica
      <span id="title-fixture">—</span>
    </div>

    <div class="menubar">
      <div class="menu">
        <button type="button" class="menu-root">File</button>
        <div class="menu-drop">
          <button type="button" id="btn-new">New<span>Ctrl+N</span></button>
          <button type="button" id="btn-import">Open…<span>Ctrl+O</span></button>
          <button type="button" id="btn-export">Save .d4<span>Ctrl+S</span></button>
        </div>
      </div>
      <button type="button" class="menu-root" disabled title="MVP">Edit</button>
      <button type="button" class="menu-root" disabled title="MVP">View</button>
      <button type="button" class="menu-root" disabled title="MVP">Tools</button>
      <button type="button" class="menu-root" disabled title="MVP">Help</button>
      <input type="file" id="file-import" accept=".d4,.xml,text/xml" class="hidden" />
      <div class="spacer"></div>
      <span class="badge">Alineado a PB 3.4.1 (Wine) · .d4 MVP</span>
    </div>

    <div class="workspace">
      <aside class="nav-pane" id="nav-pane">
        <div class="pane-header">Navigation Pane</div>
        <div class="pane-body">
          <ul class="tree" id="tree"></ul>
        </div>
      </aside>

      <section class="catalog-pane">
        <div class="pane-header">Attribute Pane</div>
        <div class="tabs" id="catalog-tabs">
          <button type="button" data-tab="attributes" class="active">Attributes</button>
          <button type="button" data-tab="functions">Functions</button>
          <button type="button" data-tab="created">Created Attributes</button>
          <button type="button" data-tab="current">Current Functions</button>
          <button type="button" data-tab="history">History</button>
          <button type="button" data-tab="modes">Modes</button>
          <button type="button" data-tab="macros">Macros</button>
          <button type="button" data-tab="palettes">Palettes</button>
          <button type="button" data-tab="swatch">Swatch</button>
        </div>
        <div class="pane-body" id="catalog-body"></div>
      </section>

      <section class="props-pane">
        <div class="pane-header">Properties Pane</div>
        <div class="tabs" id="props-tabs">
          <button type="button" data-tab="properties" class="active">Properties</button>
          <button type="button" data-tab="dmx">DMX Values</button>
          <button type="button" data-tab="channels">Channels</button>
          <button type="button" data-tab="wheels">Wheel Mapping</button>
          <button type="button" data-tab="locate">Locate Values</button>
          <button type="button" data-tab="cells">Cells</button>
        </div>
        <div class="pane-body" id="props-body"></div>
        <div class="help-bar" id="help-bar">Name: Name of this fixture.</div>
      </section>
    </div>

    <div class="status">
      <span id="status-text">Listo.</span>
      <span id="status-counts">0 attrs · 0 modes</span>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
